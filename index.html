<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>WeatherLayers demo</title>
    <script type="module" crossorigin src="/weather-layers-demo/assets/index-C90RM_TA.js"></script>
    <link rel="stylesheet" crossorigin href="/weather-layers-demo/assets/index-DX3oXOQ7.css">
  </head>
  <body>
    <div id="lmap"></div>
    <div
      id="timeline-controls"
      style="position: absolute; bottom: 10px; left: 10px; z-index: 1000"
    ></div>
    <div
      class="layer-controls"
      style="position: absolute; top: 10px; right: 10px; z-index: 1000"

      <label style="color: white; margin-left: 10px">
        <input type="checkbox" id="contourToggle" checked />

      <button id="tempBtn" class="layer-btn active">Temperature</button>
      <button id="rainBtn" class="layer-btn inactive">Rain</button>
    </div>

  </body>
